services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: giti
      POSTGRES_USER: giti
      POSTGRES_PASSWORD: giti
    ports:
      - "5432:5432"
    volumes:
      - giti-pg:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  giti-pg:
